[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
# Symbolic specs under test/symbolic are run by Halmos, not forge.
no_match_path = "test/symbolic/*"

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = false

[profile.default.fuzz]
runs = 512
